services:
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: omnichannel_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: omnichannel_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: omnichannel_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata: